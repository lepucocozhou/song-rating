<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5e6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Song Rating">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>Album bewerten</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/bewerten.css">
<link rel="stylesheet" href="assets/css/album.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<header id="top" data-active="rateAlbum"></header>

<div class="score">
  <div class="wrap">
    <div class="score-top">
      <div class="final">
        <div id="barCover"></div>
        <div class="final-badge" id="badge"><span id="final">–</span></div>
        <div>
          <div class="lbl">Album-Score</div>
          <div class="now" id="now"></div>
          <div class="hint" id="finalHint"></div>
        </div>
      </div>
      <div class="answered" id="answered"></div>
    </div>
    <div class="cats" id="catsMini">
      <div class="cat-mini" style="--c:#0ea5e9">
        <div class="row"><span id="songPartLabel">Songs Ø</span><b id="songAvg">–</b></div>
        <div class="bar"><i id="songAvgBar"></i></div>
      </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="steps" id="steps"></div>
  <div id="pages">
    <!-- Seite 1: Album auswählen + Modus -->
    <div class="page">
      <div class="page-title"><h2>Welches Album?</h2></div>
      <div class="search">
        <input id="search" placeholder="Album oder Artist suchen …" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <div id="picked"></div>
      <div class="meta-title">Details – werden durch die Suche ausgefüllt:</div>
      <div class="meta two">
        <label>Album<input id="album"></label>
        <label>Artist<input id="artist"></label>
      </div>
      <div class="meta-title">Wie wichtig sind dir die einzelnen Songs?</div>
      <div class="modes" id="modes"></div>
    </div>
    <!-- Seite 2: Songs des Albums -->
    <div class="page">
      <div class="page-title"><h2 style="color:#0ea5e9">Songs</h2><b id="songsAvgTitle">–</b></div>
      <div id="tracks"></div>
    </div>
    <!-- Album-Fragen werden aus den Einstellungen erzeugt -->
    <div class="page">
      <div class="page-title"><h2 style="color:var(--accent-strong)">Ergebnis</h2></div>
      <div id="formula"></div>
      <div class="sum" id="sum"></div>
      <div class="missing" id="missing"></div>
      <div class="save-row">
        <button class="primary" id="save">💾 In Alben speichern</button>
        <button id="newAlbum">Neues Album</button>
        <button class="danger" id="delete" hidden>🗑 Löschen</button>
        <span class="toast" id="toast"></span>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/defaults.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/js/cloud-config.js"></script>
<script src="assets/js/cloud.js"></script>
<script src="assets/js/itunes.js"></script>
<script src="assets/js/search-box.js"></script>
<script src="assets/js/questionnaire.js"></script>
<script src="assets/js/album.js"></script>
</body>
</html>
