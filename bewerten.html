<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5e6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Song Rating">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>Song bewerten</title>
<script src="assets/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,600&display=swap">
<link rel="stylesheet" href="assets/css/base.css?v=7">
<link rel="stylesheet" href="assets/css/bewerten.css?v=5">
<link rel="stylesheet" href="assets/css/mobile.css?v=9">
</head>
<body>
<header id="top" data-active="rate"></header>

<div class="rate">
  <aside class="side">
    <div class="side-head">
      <div id="barCover"></div>
      <div class="side-title"><div class="now" id="now"></div><div class="now-sub" id="nowSub"></div><div class="answered" id="answered"></div></div>
    </div>
    <div class="final">
      <div class="final-badge" id="badge"><span id="final">–</span></div>
      <div class="final-text"><div class="lbl" id="finalLbl">Final Score</div><div class="hint" id="finalHint"></div></div>
    </div>
    <div class="cats" id="catsMini"></div>
    <div class="steps" id="steps"></div>
  </aside>

  <main class="rate-main">
  <a class="backlink" id="backToAlbum" hidden>← Zurück zum Album</a>
  <div id="pages">
    <div class="page">
      <div class="page-title"><h2>Welcher Song?</h2></div>
      <div class="search">
        <input id="search" placeholder="Song oder Artist suchen …" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <div id="picked"></div>
      <div class="meta-title">Details – werden durch die Suche ausgefüllt, du kannst sie aber auch selbst eintragen oder ändern:</div>
      <div class="meta">
        <label>Song<input id="song"></label>
        <label>Artist<input id="artist"></label>
        <label>Album<input id="album"></label>
      </div>
    </div>
    <!-- Kategorie-Seiten werden aus den Einstellungen erzeugt -->
    <div class="page">
      <div class="page-title"><h2 style="color:var(--accent-strong)">Ergebnis</h2></div>
      <div class="result-card">
        <div class="rc-text"><div class="rc-title" id="rcTitle"></div><div class="rc-hint" id="rcHint"></div></div>
        <div class="rc-score" id="rcScore">–</div>
      </div>
      <div class="sum" id="sum"></div>
      <div class="save-row">
        <button class="primary" id="save">In Übersicht speichern</button>
        <button id="newSong">Neuer Song</button>
        <button class="danger" id="delete" hidden>Löschen</button>
        <span class="toast" id="toast"></span>
      </div>
    </div>
  </div>
</main>
</div>

<script src="assets/js/defaults.js"></script>
<script src="assets/js/texts-de.js"></script>
<script src="assets/js/texts-zh.js"></script>
<script src="assets/js/language.js?v=2"></script>
<script src="assets/js/i18n-zh.js?v=2"></script>
<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/common.js?v=12"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/js/cloud-config.js"></script>
<script src="assets/js/cloud.js"></script>
<script src="assets/js/itunes.js"></script>
<script src="assets/js/search-box.js"></script>
<script src="assets/js/questionnaire.js?v=11"></script>
<script src="assets/js/bewerten.js?v=11"></script>
</body>
</html>
