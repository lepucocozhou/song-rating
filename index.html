<body>
<header id="top" data-active="start"></header>

<main class="start">
  <div class="hero-wrap">
    <section class="hero">
      <div>
        <h1 id="greeting"></h1>
        <p id="summary"></p>
      </div>
      <div class="hero-actions">
        <a class="btn hero-main" href="bewerten.html">Song bewerten</a>
        <a class="btn hero-alt" href="album.html">Album bewerten</a>
      </div>
    </section>
  </div>

  <div class="start-main">
    <!-- filled by start.js: stats, top 3, charts – or a short intro when nothing is rated yet -->
    <div id="mine"></div>

    <section class="block" id="recsBlock" hidden>
      <div class="block-head">
        <div><h2>Für dich heute</h2><span>Songs, die zu deinen Lieblings-Artists passen – jeden Tag neu</span></div>
        <button type="button" class="recs-more" id="recsMore">Neue Vorschläge ↻</button>
      </div>
      <div class="rail" id="recs"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <div><h2>Neu &amp; angesagt</h2><span id="chartsSub">Neue Songs aus den Charts – antippen zum Bewerten</span></div>
        <div class="region-pick" id="regionPick">
          <button type="button" data-region="de">Deutschland</button>
          <button type="button" data-region="global">Global</button>
        </div>
      </div>
      <div class="rail" id="newSongs"><div class="rail-msg">Lade Charts …</div></div>
    </section>

    <section class="block">
      <div class="block-head">
        <div><h2>Neue Alben</h2><span>Frisch erschienen und gerade beliebt</span></div>
      </div>
      <div class="rail" id="newAlbums"><div class="rail-msg">Lade Charts …</div></div>
    </section>
  </div>
</main>
