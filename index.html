<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5e6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Song Rating">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>Song Rating</title>
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/start.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<header id="top" data-active="start"></header>

<main class="wrap start">
  <section class="hero">
    <div>
      <h1 id="greeting"></h1>
      <p id="summary"></p>
    </div>
    <div class="hero-actions">
      <a class="btn primary" href="bewerten.html">🎵 Song bewerten</a>
      <a class="btn" href="album.html">💿 Album bewerten</a>
    </div>
  </section>

  <!-- filled by start.js: stats, top 3, charts – or a short intro when nothing is rated yet -->
  <div id="mine"></div>

  <section class="block">
    <div class="block-head">
      <h2>🆕 Neu &amp; angesagt</h2>
      <span id="chartsSub">Neue Songs aus den Charts – antippen zum Bewerten</span>
      <div class="region-pick" id="regionPick">
        <button type="button" data-region="de">🇩🇪 Deutschland</button>
        <button type="button" data-region="global">🌍 Global</button>
      </div>
    </div>
    <div class="rail" id="newSongs"><div class="rail-msg">Lade Charts …</div></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>💿 Neue Alben</h2>
      <span>Frisch erschienen und gerade beliebt</span>
    </div>
    <div class="rail" id="newAlbums"><div class="rail-msg">Lade Charts …</div></div>
  </section>
</main>

<script src="assets/js/defaults.js"></script>
<script src="assets/js/texts-de.js"></script>
<script src="assets/js/language.js"></script>

<script src="assets/js/start.js"></script>
</body>
</html>
